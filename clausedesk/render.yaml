databases:
  - name: clausedesk-db
    plan: free

services:
  - type: web
    name: clausedesk-api
    rootDir: clausedesk
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clausedesk-db
          property: connectionString
      - key: LLM_PROVIDER
        value: openai
      - key: PROMPT_VERSION
        value: v2
      - key: OPENAI_API_KEY
        sync: false
