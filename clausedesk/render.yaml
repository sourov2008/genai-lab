databases:
  - name: clausedesk-db
    plan: free

services:
  - type: web
    name: clausedesk-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clausedesk-db
          property: connectionString
      - key: LLM_PROVIDER
        value: openai
      - key: PROMPT_VERSION
        value: v2
