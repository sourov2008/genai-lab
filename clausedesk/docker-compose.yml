services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clausedesk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clausedesk
    ports:
      - "5432:5432"
    volumes:
      - clausedesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clausedesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: clausedesk-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    
    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/clausedesk
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: clausedesk-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_ENCRYPTION_KEY: cdbe548e1cb29a67937c87945b5d1db04c3622fd0a698b57d27fcffce7561b1c
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  clausedesk_pgdata:
  n8n_data:
