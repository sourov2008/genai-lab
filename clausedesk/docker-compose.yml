services:
  db:
    image: postgres:16-alpine
    container_name: clausedesk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clausedesk
    ports:
      - "5432:5432"
    volumes:
      - clausedesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clausedesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clausedesk_pgdata:
