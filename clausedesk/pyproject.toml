[project]
name = "clausedesk"
version = "0.1.0"
description = "ClauseDesk — contract clause extraction with verified citations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "asyncpg>=0.30",
    "datasets>=5.1.0",
    "pdfplumber>=0.11.10",
    "aiosqlite>=0.22.1",
    "openai>=3.42.1",
    "groq>=1.7.0",
    "jinja2>=3.1.6",
    "pypdf>=6.21.4",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "email-validator>=2.3.0",
    "bcrypt<4.0.0",
    "langfuse>=5.2.0",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
